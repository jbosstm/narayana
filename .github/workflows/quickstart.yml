name: quickstart

permissions: {}

on:
  workflow_call:
    inputs:
      jdk_version:
        description: 'JDK version'
        required: true
        type: string
      pull_request_repo:
        description: 'Narayana repository to build (e.g. <gituser>/narayana)'
        required: false
        type: string
        default: 'jbosstm/narayana'
      pull_request_ref:
        description: 'Narayana branch or commit to test'
        required: true
        type: string
      environment_variables:
        description: 'Environment variables (JSON object)'
        required: false
        type: string
        default: '{}'

# Only run the latest job
concurrency:
  group: 'quickstart @ ${{ github.workflow }} @ ${{ github.head_ref || github.ref }} @ jdk${{ inputs.jdk_version }}'
  cancel-in-progress: true

jobs:
  quickstart-test:
    name: Quickstart Tests (JDK ${{ inputs.jdk_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Log run context
        env:
          NARAYANA_REPO: ${{ inputs.pull_request_repo || 'jbosstm/narayana' }}
          NARAYANA_BRANCH: ${{ inputs.pull_request_ref || 'main' }}
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Narayana repository: $NARAYANA_REPO"
          echo "Narayana branch/ref: $NARAYANA_BRANCH"
          echo "QUICKSTART_PR_NUMBER: ${QUICKSTART_PR_NUMBER:-not set}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: '${{ inputs.pull_request_repo || github.repository }}'
          ref: ${{ inputs.pull_request_ref || github.ref }}

      - name: Load Dynamic Environment Variables
        uses: ./.github/actions/load-env-vars
        with:
          environment_variables: ${{ inputs.environment_variables }}

      - name: Clone quickstart repository
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://github.com/jbosstm/quickstart.git quickstart
          if [ -n "$QUICKSTART_PR_NUMBER" ]; then
            if ! [[ "$QUICKSTART_PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::QUICKSTART_PR_NUMBER must be numeric, got: '$QUICKSTART_PR_NUMBER'"
              exit 1
            fi
            cd quickstart
            git fetch origin "+refs/pull/$QUICKSTART_PR_NUMBER/head:refs/remotes/origin/pull/$QUICKSTART_PR_NUMBER/head"
            git checkout "remotes/origin/pull/$QUICKSTART_PR_NUMBER/head"
            # Rebase explicitly: "git pull --rebase --ff-only" aborts once the PR branch and
            # main have diverged, which is the normal case for a PR that is not up to date
            git fetch origin main
            git rebase origin/main
            cd ..
          fi

      - name: Set up JDK ${{ inputs.jdk_version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_version }}
          cache: 'maven'
          cache-dependency-path: quickstart/**/pom.xml

      - name: Run quickstart tests
        env:
          NARAYANA_REPO: ${{ inputs.pull_request_repo || 'jbosstm/narayana' }}
          NARAYANA_BRANCH: ${{ inputs.pull_request_ref || 'main' }}
        run: |
          # quickstart.sh expects NARAYANA_REPO as the GitHub org/user name only
          # (it builds the clone URL as https://github.com/${NARAYANA_REPO}/narayana.git)
          export NARAYANA_REPO="${NARAYANA_REPO%%/*}"
          echo "Building narayana from: https://github.com/${NARAYANA_REPO}/narayana.git -b ${NARAYANA_BRANCH}"
          cd quickstart
          WORKSPACE=$(pwd) ./.github/scripts/quickstart.sh

      - name: Upload logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          retention-days: 30
          name: quickstart-logs-jdk${{ inputs.jdk_version }}
          path: |
            quickstart/**/*.*log*
            quickstart/**/target/*surefire-reports*/**
            quickstart/**/target/*failsafe-reports*/**
          if-no-files-found: warn
