name: axes_selector

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      jdk17:
        description: 'JDK17'
        required: true
        type: boolean
      jdk21:
        description: 'JDK21'
        required: true
        type: boolean
      jdk25:
        description: 'JDK25'
        required: true
        type: boolean
        default: true
      CORE:
        description: 'CORE testing axis'
        required: true
        type: boolean
        default: true
      RTS:
        description: 'RTS testing axis'
        required: true
        type: boolean
      XTS:
        description: 'XTS testing axis'
        required: true
        type: boolean
      AS_TESTS:
        description: 'AS_TESTS testing axis'
        required: true
        type: boolean
      QA_JTA:
        description: 'QA_JTA testing axis'
        required: true
        type: boolean
      QA_JTS_OPENJDKORB:
        description: 'QA_JTS_OPENJDKORB testing axis'
        required: true
        type: boolean
      JACOCO:
        description: 'JACOCO testing axis'
        required: true
        type: boolean
      DB_TESTS:
        description: 'DB_TESTS testing axis'
        required: true
        type: boolean
      PERFORMANCE:
        description: 'PERFORMANCE testing axis'
        required: true
        type: boolean
      QUICKSTART:
        description: 'QUICKSTART testing axis'
        required: true
        type: boolean
      EXPERIMENTAL:
        description: 'EXPERIMENTAL testing axis'
        required: true
        type: boolean
      enabled_databases:
        description: 'JSON array of databases to use for the DB_TESTS testing axis (default: all).'
        required: false
        type: string
        default: '["postgres","mysql","oracle","db2"]'
      pull_request_repo:
        description: 'Repository to check out'
        required: false
        type: string
      pull_request_ref:
        description: 'Branch or commit to test'
        required: false
        type: string
      AS_BRANCH:
        description: 'AS_BRANCH: the branch/commit of jboss-as to checkout.'
        required: false
        type: string
      NARAYANA_FORK_BRANCH_TO_REBASE_ON:
        description: 'NARAYANA_FORK_BRANCH_TO_REBASE_ON'
        required: false
        type: string
      SPI_BRANCH:
        description: 'SPI_BRANCH: the branch/commit of jboss-transaction-spi to checkout.'
        required: false
        type: string
      PERF_PR_NUMBER:
        description: 'PERF_PR_NUMBER: PR number to checkout for the performance repo tests.'
        required: false
        type: string
      QUICKSTART_PR_NUMBER:
        description: 'QUICKSTART_PR_NUMBER: PR number to checkout for the quickstart repo tests.'
        required: false
        type: string
      benchmarks:
        description: 'JSON array of benchmark groups to run (default: all)'
        required: false
        type: string
        default: '["stores", "comparisons", "rts", "transports", "journal"]'
  workflow_call:
    inputs:
      jdk_versions:
        description: 'JDK versions'
        required: false
        type: string
        default: '["25"]'
      pull_request_repo:
        description: 'Repository to check out (optional)'
        required: false
        type: string
      pull_request_ref:
        description: 'Branch or commit to test (optional)'
        required: false
        type: string
      CORE:
        description: 'CORE testing axis'
        required: false
        type: boolean
        default: true
      RTS:
        description: 'RTS testing axis'
        required: true
        type: boolean
      XTS:
        description: 'XTS testing axis'
        required: true
        type: boolean
      AS_TESTS:
        description: 'AS_TESTS testing axis'
        required: true
        type: boolean
      QA_JTA:
        description: 'QA_JTA testing axis'
        required: true
        type: boolean
      QA_JTS_OPENJDKORB:
        description: 'QA_JTS_OPENJDKORB testing axis'
        required: true
        type: boolean
      JACOCO:
        description: 'JACOCO testing axis'
        required: true
        type: boolean
      DB_TESTS:
        description: 'DB_TESTS testing axis'
        required: true
        type: boolean
      PERFORMANCE:
        description: 'PERFORMANCE testing axis'
        required: true
        type: boolean
      QUICKSTART:
        description: 'QUICKSTART testing axis'
        required: false
        type: boolean
      EXPERIMENTAL:
        description: 'EXPERIMENTAL testing axis'
        required: false
        type: boolean
      enabled_databases:
        description: 'The collection of databases to test against'
        required: false
        type: string
        default: '["postgres","mysql","oracle","db2"]'
      environment_variables:
        description: 'The environment variables to use in narayana.sh'
        required: false
        type: string
        default: '{}'
      benchmarks:
        description: 'JSON array of benchmark groups to run (default: all)'
        required: false
        type: string
        default: '["stores", "comparisons", "rts", "transports", "journal"]'

permissions:
  actions: write
  pull-requests: read
  contents: read

jobs:
  axes_selector:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    outputs:
      CORE: ${{ steps.parse.outputs.CORE || steps.set-axes-inputs.outputs.CORE || inputs.CORE }}
      AS_TESTS: ${{ steps.parse.outputs.AS_TESTS || steps.set-axes-inputs.outputs.AS_TESTS || inputs.AS_TESTS }}
      RTS: ${{ steps.parse.outputs.RTS || steps.set-axes-inputs.outputs.RTS || inputs.RTS }}
      XTS: ${{ steps.parse.outputs.XTS || steps.set-axes-inputs.outputs.XTS || inputs.XTS }}
      QA_JTA: ${{ steps.parse.outputs.QA_JTA || steps.set-axes-inputs.outputs.QA_JTA || inputs.QA_JTA }}
      QA_JTS_OPENJDKORB: ${{ steps.parse.outputs.QA_JTS_OPENJDKORB || steps.set-axes-inputs.outputs.QA_JTS_OPENJDKORB || inputs.QA_JTS_OPENJDKORB }}
      JACOCO: ${{ steps.parse.outputs.JACOCO || steps.set-axes-inputs.outputs.JACOCO || inputs.JACOCO }}
      DB_TESTS: ${{ steps.parse.outputs.DB_TESTS || steps.set-axes-inputs.outputs.DB_TESTS || inputs.DB_TESTS }}
      PERFORMANCE: ${{ steps.parse.outputs.PERFORMANCE || steps.set-axes-inputs.outputs.PERFORMANCE || inputs.PERFORMANCE }}
      QUICKSTART: ${{ steps.parse.outputs.QUICKSTART || steps.set-axes-inputs.outputs.QUICKSTART || inputs.QUICKSTART }}
      EXPERIMENTAL: ${{ steps.parse.outputs.EXPERIMENTAL || steps.set-axes-inputs.outputs.EXPERIMENTAL || inputs.EXPERIMENTAL }}
      enabled_databases: ${{ steps.parse.outputs.enabled_databases || steps.set-axes-inputs.outputs.enabled_databases || inputs.enabled_databases }}
      jdk_versions: ${{ steps.parse.outputs.jdk_versions || steps.set-axes-inputs.outputs.jdk_versions || inputs.jdk_versions }}
      environment_variables: ${{ steps.parse.outputs.environment_variables || steps.set-axes-inputs.outputs.environment_variables || inputs.environment_variables }}
      benchmarks: ${{ steps.parse.outputs.benchmarks || inputs.benchmarks || '["stores", "comparisons", "rts", "transports", "journal"]' }}
      pr_number: ${{ steps.set-pr-data.outputs.pr_number }}
      pr_ref: ${{ steps.set-pr-data.outputs.pr_ref || inputs.pull_request_ref }}
      pr_repo: ${{ steps.set-pr-data.outputs.pr_repo || inputs.pull_request_repo }}

    steps:
      - name: Extract PR metadata
        id: set-pr-data
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_ref=$PR_REF"
            echo "pr_repo=$PR_REPO"
          } >> "$GITHUB_OUTPUT"

      - name: Parse PR description
        id: parse
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const prBody = pr.body || '';

            // Everything from the ignore marker onwards (the reference section of the PR
            // template) is excluded, so the template's own instructions and examples
            // (axis names, SPI_BRANCH=main, etc.) are never parsed as selections. If the
            // marker is absent (e.g. a PR created from an older template), parse it all.
            const IGNORE_MARKER = '<!-- ci-ignore-below -->';
            const ignoreIdx = prBody.indexOf(IGNORE_MARKER);
            const selectionText = ignoreIdx !== -1 ? prBody.slice(0, ignoreIdx) : prBody;
            if (ignoreIdx !== -1) {
              core.info('Ignoring the PR template reference section below the ci-ignore marker.');
            } else {
              core.info('No ci-ignore marker found; parsing the whole PR description.');
            }

            const workflowAxes = [
              'CORE',
              'AS_TESTS',
              'RTS',
              'XTS',
              'QA_JTA',
              'QA_JTS_OPENJDKORB',
              'JACOCO',
              'DB_TESTS',
              'PERFORMANCE',
              'QUICKSTART',
              'EXPERIMENTAL'
            ];
            
            // Convert '! AXIS' to '!AXIS'
            const processedBody = selectionText.replace(/!\s+/g, '!');
            // Normalise description: replace newlines and commas with spaces and split the result into a set of tokens
            const tokens = new Set(processedBody.replace(/[\r\n,]/g, ' ').split(/\s+/));

            if (tokens.has('NO_TESTS')) {
              core.info('NO_TESTS was requested. No axes will be started.');
            } else {
              let axis_selected = false;
              let db_tests_triggered = false;
              // Determine which workflows to run
              for (const axis of workflowAxes) {
                if (tokens.has(axis) && !tokens.has(`!${axis}`)) {
                  core.info(`Axis ${axis} REQUESTED.`);
                  core.setOutput(axis, 'true');
                  if (axis == 'DB_TESTS') {
                    db_tests_triggered = true;
                  }
                  axis_selected = true;
                } else {
                  core.info(`Axis ${axis} NOT REQUESTED.`);
                  core.setOutput(axis, 'false');
                }
              }
  
              if (!axis_selected) {
                  core.info(`No axis was requested, so run CORE at least.`);
                  core.setOutput('CORE', 'true');
              }
              
              if (db_tests_triggered) {
                const possibleDBs = ['mysql', 'db2', 'postgres', 'oracle'];
              
                let selectedDBs = [];
                for (const db of possibleDBs) {
                  if (tokens.has(db) && !tokens.has(`!${db}`)) {
                    core.info(`Database ${db} SELECTED.`);
                    selectedDBs.push(db);
                  } else {
                    core.info(`Database ${db} NOT REQUESTED.`);
                  }
                }
              
                if (selectedDBs.length === 0) {
                  core.info(`Empty or invalid input. All possible databases will be selected: ${possibleDBs.join(', ')}`);
                  selectedDBs = possibleDBs;
                }
              
                core.setOutput('enabled_databases', JSON.stringify(selectedDBs));
              }
              
              // Matches JDK17, JDK21, etc.
              const jdkRegex = /\bJDK(17|21|25)\b/gi;
              const matches = [...selectionText.matchAll(jdkRegex)];
              let jdk_versions = matches.map(m => parseInt(m[1], 10));
              if (jdk_versions.length === 0) {
                jdk_versions = [25];
                core.info(`Using JDK25.`);
              } else {
                core.info(`JDKs detected in PR body: ${jdk_versions}`);
              }
              core.setOutput('jdk_versions', JSON.stringify(jdk_versions));
              
              const possibleEnvVars = [
                'AS_BRANCH',
                'SPI_BRANCH',
                'PERF_PR_NUMBER',
                'QUICKSTART_PR_NUMBER',
                'JMH_MEASUREMENT_TIME',
                'JMH_FORKS',
                'JMH_WARMUP_ITERATIONS',
                'JMH_MEASUREMENT_ITERATIONS'
              ];
              
              const extractedEnvVars = {};
              
              for (const varName of possibleEnvVars) {
                // Matches "VAR=value" stopping at the first whitespace
                const regex = new RegExp(`\\b${varName}=([^\\s]+)`);
                const match = selectionText.match(regex);
              
                if (match) {
                  const value = match[1];
                  core.info(`Environment variables ${varName} detected: ${value}`);
                  extractedEnvVars[varName] = value;
                }
              }
              
              core.setOutput('environment_variables', JSON.stringify(extractedEnvVars));

              // Parse BENCHMARKS=stores,journal (comma and/or space separated list of benchmark groups)
              const validBenchmarks = ['stores', 'comparisons', 'rts', 'transports', 'journal'];
              // Capture everything after the =, up to end of line or up to another KEY=value
              // pair on the same line (e.g. "BENCHMARKS=stores,journal JMH_FORKS=1"), so a
              // variable sharing the line with BENCHMARKS isn't swept into the benchmark list.
              const benchmarkRegex = /\bBENCHMARKS=([^\r\n]*?)(?=\s+[A-Za-z_][A-Za-z0-9_]*=|[\r\n]|$)/;
              const benchmarkMatch = selectionText.match(benchmarkRegex);
              if (benchmarkMatch) {
                const benchmarkList = benchmarkMatch[1].replace(/[\r\n,]/g, ' ').split(/\s+/).filter(Boolean);
                if (benchmarkList.length === 0) {
                  core.setFailed(`BENCHMARKS= is empty. Valid groups: ${validBenchmarks.join(', ')}`);
                  return;
                }
                const invalid = benchmarkList.filter(b => !validBenchmarks.includes(b));
                if (invalid.length > 0) {
                  core.setFailed(`Unknown benchmark group(s): ${invalid.join(', ')}. Valid groups: ${validBenchmarks.join(', ')}`);
                  return;
                }
                core.info(`Benchmarks detected in PR body: ${benchmarkList}`);
                core.setOutput('benchmarks', JSON.stringify(benchmarkList));
              }
            }

      - name: Set axes according to triggering event
        id: set-axes-inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          AS_BRANCH: ${{ inputs.AS_BRANCH }}
          NARAYANA_FORK_BRANCH_TO_REBASE_ON: ${{ inputs.NARAYANA_FORK_BRANCH_TO_REBASE_ON }}
          SPI_BRANCH: ${{ inputs.SPI_BRANCH }}
          PERF_PR_NUMBER: ${{ inputs.PERF_PR_NUMBER }}
          QUICKSTART_PR_NUMBER: ${{ inputs.QUICKSTART_PR_NUMBER }}
          ENABLED_DATABASES: ${{ inputs.enabled_databases }}
        with:
          script: |
            // Creates jdk_versions
            const jdk_versions = [
              ${{ inputs.jdk17 }} && '17',
              ${{ inputs.jdk21 }} && '21',
              ${{ inputs.jdk25 }} && '25'
            ].filter(Boolean);

            core.setOutput('jdk_versions', JSON.stringify(jdk_versions));
            core.setOutput('CORE', '${{ inputs.CORE }}');
            core.setOutput('AS_TESTS', '${{ inputs.AS_TESTS }}');
            core.setOutput('RTS', '${{ inputs.RTS }}');
            core.setOutput('XTS', '${{ inputs.XTS }}');
            core.setOutput('QA_JTA', '${{ inputs.QA_JTA }}');
            core.setOutput('QA_JTS_OPENJDKORB', '${{ inputs.QA_JTS_OPENJDKORB }}');
            core.setOutput('JACOCO', '${{ inputs.JACOCO }}');
            core.setOutput('DB_TESTS', '${{ inputs.DB_TESTS }}');
            core.setOutput('PERFORMANCE', '${{ inputs.PERFORMANCE }}');
            core.setOutput('QUICKSTART', '${{ inputs.QUICKSTART }}');
            core.setOutput('EXPERIMENTAL', '${{ inputs.EXPERIMENTAL }}');
            if (${{ inputs.DB_TESTS }}) {
              // enabled_databases is a JSON array string; validate it and fall back to all DBs if empty/invalid
              const possibleDBs = ['postgres', 'mysql', 'oracle', 'db2'];
              let selected_databases = [];
              try {
                selected_databases = JSON.parse(process.env.ENABLED_DATABASES || '[]')
                  .filter(db => possibleDBs.includes(db));
              } catch (e) {
                core.info(`enabled_databases is not valid JSON: ${process.env.ENABLED_DATABASES}`);
              }

              if (selected_databases.length === 0) {
                core.info(`No valid database has been selected. All possible databases will be activated: ${possibleDBs.join(', ')}`);
                core.setOutput('enabled_databases', JSON.stringify(possibleDBs));
              } else {
                core.setOutput('enabled_databases', JSON.stringify(selected_databases));
              }
            }
            
            const extractedEnvVars = Object.fromEntries([
              ['AS_BRANCH', process.env.AS_BRANCH ?? ''],
              ['NARAYANA_FORK_BRANCH_TO_REBASE_ON', process.env.NARAYANA_FORK_BRANCH_TO_REBASE_ON ?? ''],
              ['SPI_BRANCH', process.env.SPI_BRANCH ?? ''],
              ['PERF_PR_NUMBER', process.env.PERF_PR_NUMBER ?? ''],
              ['QUICKSTART_PR_NUMBER', process.env.QUICKSTART_PR_NUMBER ?? '']
            ].filter(entry => entry[1] !== ''));

            core.info(`Custom Envs: ${JSON.stringify(extractedEnvVars)}`);
            core.setOutput('environment_variables', JSON.stringify(extractedEnvVars));

  as_builder:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.CORE == 'true' ||
      needs.axes_selector.outputs.RTS == 'true' ||
      needs.axes_selector.outputs.XTS == 'true' ||
      needs.axes_selector.outputs.JACOCO == 'true' }}
    uses: ./.github/workflows/as_builder.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      environment_variables: ${{ needs.axes_selector.outputs.environment_variables }}

  CORE:
    needs: [axes_selector, as_builder]
    if: ${{ needs.axes_selector.outputs.CORE == 'true' }}
    uses: ./.github/workflows/core.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      narayana_artifact_name: ${{ github.run_id }}-narayana-artifacts-jdk${{ matrix.jdk_version }}
      jboss_as_zip_name: ${{ github.run_id }}-jboss-as-zip-jdk${{ matrix.jdk_version }}

  RTS:
    needs: [axes_selector, as_builder]
    if: ${{ needs.axes_selector.outputs.RTS == 'true' }}
    uses: ./.github/workflows/rts.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      narayana_artifact_name: ${{ github.run_id }}-narayana-artifacts-jdk${{ matrix.jdk_version }}
      jboss_as_zip_name: ${{ github.run_id }}-jboss-as-zip-jdk${{ matrix.jdk_version }}
      wildfly_m2_artifact_name: ${{ github.run_id }}-wildfly-m2-jdk${{ matrix.jdk_version }}

  XTS:
    needs: [axes_selector, as_builder]
    if: ${{ needs.axes_selector.outputs.XTS == 'true' }}
    uses: ./.github/workflows/xts.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      narayana_artifact_name: ${{ github.run_id }}-narayana-artifacts-jdk${{ matrix.jdk_version }}
      jboss_as_zip_name: ${{ github.run_id }}-jboss-as-zip-jdk${{ matrix.jdk_version }}
      wildfly_m2_artifact_name: ${{ github.run_id }}-wildfly-m2-jdk${{ matrix.jdk_version }}

  JACOCO:
    needs: [axes_selector, as_builder]
    if: ${{ needs.axes_selector.outputs.JACOCO == 'true' }}
    uses: ./.github/workflows/jacoco.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      narayana_artifact_name: ${{ github.run_id }}-narayana-artifacts-jdk${{ matrix.jdk_version }}
      jboss_as_zip_name: ${{ github.run_id }}-jboss-as-zip-jdk${{ matrix.jdk_version }}

  AS_TESTS:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.AS_TESTS == 'true' }}
    uses: ./.github/workflows/as_tests.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      environment_variables: ${{ needs.axes_selector.outputs.environment_variables }}

  QA_JTA:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.QA_JTA == 'true' }}
    uses: ./.github/workflows/qa_jta.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}

  QA_JTS_OPENJDKORB:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.QA_JTS_OPENJDKORB == 'true' }}
    uses: ./.github/workflows/qa_jts_openjdkorb.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}

  DB_TESTS:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.DB_TESTS == 'true' }}
    uses: ./.github/workflows/db_tests.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      enabled_databases: ${{ needs.axes_selector.outputs.enabled_databases }}

  PERFORMANCE:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.PERFORMANCE == 'true' }}
    uses: ./.github/workflows/performance.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      environment_variables: ${{ needs.axes_selector.outputs.environment_variables }}
      benchmarks: ${{ needs.axes_selector.outputs.benchmarks }}

  QUICKSTART:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.QUICKSTART == 'true' }}
    uses: ./.github/workflows/quickstart.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      environment_variables: ${{ needs.axes_selector.outputs.environment_variables }}

  EXPERIMENTAL:
    needs: axes_selector
    if: ${{ needs.axes_selector.outputs.EXPERIMENTAL == 'true' }}
    uses: ./.github/workflows/experimental.yml
    strategy:
      matrix:
        jdk_version: ${{ fromJSON(needs.axes_selector.outputs.jdk_versions) }}
    with:
      jdk_version: ${{ matrix.jdk_version }}
      pull_request_ref: ${{ needs.axes_selector.outputs.pr_ref }}
      pull_request_repo: ${{ needs.axes_selector.outputs.pr_repo }}
      environment_variables: ${{ needs.axes_selector.outputs.environment_variables }}
