name: as_builder

on:
  workflow_call:
    inputs:
      jdk_version:
        description: 'JDK version'
        required: true
        type: string
      pull_request_repo:
        description: 'Repository to check out'
        required: false
        type: string
        default: 'jbosstm/narayana'
      pull_request_ref:
        description: 'Branch or commit to test'
        required: true
        type: string
      environment_variables:
        description: 'Environment variables'
        required: false
        type: string
        default: '{}'

# Only run the latest job
concurrency:
  group: 'as_builder @ ${{ github.workflow }} @ ${{ github.head_ref || github.ref }} @ jdk${{ inputs.jdk_version }}'
  cancel-in-progress: true

jobs:
  as_builder:
    name: as_builder with JDK ${{ inputs.jdk_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Log run context
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Repository: ${{ inputs.pull_request_repo || github.repository }}"
          echo "Branch/Ref: ${{ inputs.pull_request_ref || github.ref }}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: '${{ inputs.pull_request_repo || github.repository }}'
          ref: ${{ inputs.pull_request_ref || github.ref }}

      - name: Load Dynamic Environment Variables
        uses: ./.github/actions/load-env-vars
        with:
          environment_variables: ${{ inputs.environment_variables }}

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build-env
        with:
          jdk_version: ${{ inputs.jdk_version }}

      - name: Build Narayana and WildFly
        id: builds
        run: |
          NARAYANA_BUILD=1 AS_BUILD=1 ./.github/scripts/narayana.sh
          {
            echo "narayana_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml | tr -d '%')"
            echo "wildfly_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f jboss-as/pom.xml | tr -d '%')"
          } >> "$GITHUB_OUTPUT"

      - name: Export Narayana artifact name
        id: export-artifacts-names
        run: |
          echo "narayana_artifact_name=${{ github.run_id }}-narayana-artifacts-jdk${{ inputs.jdk_version }}" >> "$GITHUB_OUTPUT"

      - name: Save Narayana Maven repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          compression-level: '0'
          retention-days: 1
          name: ${{ steps.export-artifacts-names.outputs.narayana_artifact_name }}
          path: ~/.m2/repository/org/jboss/narayana

      - name: Export jboss-as zip name
        id: export-jboss-as-zip-name
        run: |
          echo "jboss_as_zip_name=${{ github.run_id }}-jboss-as-zip-jdk${{ inputs.jdk_version }}" >> "$GITHUB_OUTPUT"

      - name: Save jboss-as
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 1
          name: ${{ steps.export-jboss-as-zip-name.outputs.jboss_as_zip_name }}
          path: ${{ github.workspace }}/jboss-as/dist/target/wildfly-${{ steps.builds.outputs.wildfly_version }}.zip

      - name: Stage WildFly artifacts needed by RTS and XTS
        run: |
          ./.github/scripts/stage-wildfly-m2.sh \
            "${{ runner.temp }}/wildfly-m2" \
            "${{ steps.builds.outputs.wildfly_version }}" \
            "${{ steps.builds.outputs.narayana_version }}"

      - name: Export WildFly Maven artifacts name
        id: export-wildfly-m2-name
        run: |
          echo "wildfly_m2_artifact_name=${{ github.run_id }}-wildfly-m2-jdk${{ inputs.jdk_version }}" >> "$GITHUB_OUTPUT"

      - name: Save WildFly Maven artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          compression-level: '0'
          retention-days: 1
          name: ${{ steps.export-wildfly-m2-name.outputs.wildfly_m2_artifact_name }}
          path: ${{ runner.temp }}/wildfly-m2
