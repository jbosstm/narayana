name: experimental

on:
  workflow_call:
    inputs:
      jdk_version:
        description: 'JDK version'
        required: true
        type: string
      pull_request_repo:
        description: 'Repository to check out'
        required: false
        type: string
        default: 'jbosstm/narayana'
      pull_request_ref:
        description: 'Branch or commit to test'
        required: false
        type: string
      environment_variables:
        description: 'Environment variables'
        required: false
        type: string
        default: '{}'

# Only run the latest job
concurrency:
  group: 'experimental @ ${{ github.workflow }} @ ${{ github.head_ref || github.ref }} @ jdk${{ inputs.jdk_version }}'
  cancel-in-progress: true

jobs:
  experimental-tests:
    name: EXPERIMENTAL axis with JDK ${{ inputs.jdk_version }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Load Dynamic Environment Variables
        uses: actions/github-script@v9
        if: ${{ inputs.environment_variables != '' && inputs.environment_variables != '{}' }}
        env:
          ENV_JSON: ${{ inputs.environment_variables }}
        with:
          script: |
            const envs = JSON.parse(process.env.ENV_JSON);
            for (const [key, value] of Object.entries(envs)) {
              core.exportVariable(key, value);
              core.info(`Set ${key}=${value}`);
            }

      - name: Log run context
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Repository: ${{ inputs.pull_request_repo || github.repository }}"
          echo "Branch/Ref: ${{ inputs.pull_request_ref || github.ref }}"
          echo "JDK Version: ${{ inputs.jdk_version }}"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: '${{ inputs.pull_request_repo || github.repository }}'
          ref: ${{ inputs.pull_request_ref || github.ref }}

      - name: Set up JDK ${{ inputs.jdk_version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_version }}
          cache: 'maven'

      - name: Remove Narayana from Maven cache
        run: |
          rm -rf ~/.m2/repository/org/jboss/narayana

      # Experimental modules depend on the main project artifacts, so the whole
      # project is installed in the local repository first.
      - name: Build Narayana core (without experimental)
        id: core_build
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          mvn clean install -DskipTests -Dcheckstyle.skip=true -Denforcer.skip=true

      # Builds and tests every module registered in experimental/pom.xml
      - name: Build experimental modules
        id: experimental_build
        run: |
          mvn clean install -f experimental/pom.xml -Dcheckstyle.skip=true -Denforcer.skip=true

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && (steps.core_build.conclusion == 'failure' || steps.experimental_build.conclusion == 'failure')) || cancelled() }}
        with:
          retention-days: 30
          name: experimental-logs-jdk${{ inputs.jdk_version }}
          path: |
            **/*.*log*
            **/ObjectStore*/**
            **/tx-object-store/**
            **/target/*surefire-reports*/**
            **/target/*failsafe-reports*/**
          if-no-files-found: warn

      - name: Upload experimental test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          retention-days: 7
          name: experimental-test-results-jdk${{ inputs.jdk_version }}
          path: |
            experimental/**/target/surefire-reports/**
            experimental/**/target/failsafe-reports/**
          if-no-files-found: warn
