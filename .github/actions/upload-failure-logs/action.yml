name: Upload failure logs
description: Upload test failure logs as an artifact

inputs:
  name:
    description: 'Artifact name'
    required: true
  path:
    description: 'Files to upload (defaults to common failure log glob)'
    required: false
    default: |
      **/*.*log*
      **/ObjectStore*/**
      **/tx-object-store/**
      **/*tx-object-store.zip
      **/target/*surefire-reports*/**
      **/target/*failsafe-reports*/**
  retention_days:
    description: 'Artifact retention period in days'
    required: false
    default: '30'
  if_no_files_found:
    description: 'Behavior if no files are found (warn, error, ignore)'
    required: false
    default: 'warn'

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention_days }}
        if-no-files-found: ${{ inputs.if_no_files_found }}
